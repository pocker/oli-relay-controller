substitutions:
  name: "oli-relay-controller"
  friendly_name: "Fűtés relé vezérlő"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false
  on_boot:
    - priority: 800
      then:
        - lambda: |-
            // Log boot reason for diagnosing unexpected reboots
            ESP_LOGI("boot", "Boot reason: %d", esp_reset_reason());
            ESP_LOGI("boot", "Free heap: %.1f kB", esp_get_free_heap_size() / 1024.0);
    - priority: -100
      then:
        # Apply the active profile to the inputs' initial states
        - script.execute: update_relays

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable web server and OTA updates
web_server:
  port: 80
  local: True
  auth:
    username: admin
    password: !secret esphome_web_password

# Enable OTA updates
ota:
 - platform: esphome
   password: "ea313f6fff79ec0bab75de625e2665a0"

logger:
  level: INFO

# Enable Home Assistant API
api:
  encryption:
    key: !secret futes_rele_api_key

wifi:
  # WiFi credentials
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  output_power: 15dB  # Reduced from default 20dB to lower power consumption and prevent brownout
  min_auth_mode: WPA2  # Explicit security mode setting (recommended by ESPHome 2025.11+)
  manual_ip:    
    static_ip: 192.168.1.81    
    gateway: 192.168.1.1    
    subnet: 255.255.255.0
    dns1: 192.168.1.1
    dns2: 8.8.8.8
  
  # Enable fallback hotspot (captive portal) if WiFi connection fails
  ap:
    ssid: 'relay-controller-ap'
    password: !secret relay_ap_password

captive_portal:  # This component automatically enables OTA
    
# WiFi signal strength sensor
sensor:
  - platform: wifi_signal
    name: "WiFi Signal Strength"
    update_interval: 60s
    entity_category: diagnostic

  # Diagnostic: Free heap memory monitoring (helps detect memory leaks)
  - platform: template
    name: "Free Heap"
    lambda: return esp_get_free_heap_size() / 1024.0;
    unit_of_measurement: "kB"
    update_interval: 30s
    entity_category: diagnostic
    accuracy_decimals: 1
    icon: "mdi:memory"

text_sensor:
  - platform: wifi_info    
    ip_address:
      name: "IP"
      icon: "mdi:ip-outline"
      entity_category: diagnostic
    ssid:
      name: "SSID"
      icon: "mdi:wifi-settings"
      entity_category: diagnostic
    bssid:
      name: "BSSID"
      icon: "mdi:wifi-settings"
      entity_category: diagnostic
    mac_address:
      name: "MAC"
      icon: "mdi:network-outline"
      entity_category: diagnostic
    scan_results:
      name: "Wifi Scan"
      icon: "mdi:wifi-refresh"
      entity_category: diagnostic
  - platform: uptime
    name: Uptime
    entity_category: diagnostic


# Define the binary inputs (with inverted logic since original uses active LOW)
binary_sensor:
  # Home Assistant connection status sensor
  - platform: status
    name: "Connection"
    id: connection_status
    entity_category: diagnostic
  
  - platform: gpio
    pin: GPIO21
    name: "Input T1"
    icon: "mdi:thermostat"
    id: t1
    filters:
      - invert:
      - delayed_off: 500ms
    on_state:
      - script.execute: update_relays

  - platform: gpio
    pin: GPIO19
    name: "Input T2"
    icon: "mdi:thermostat"
    id: t2
    filters:
      - invert:
      - delayed_off: 500ms
    on_state:
      - script.execute: update_relays

  - platform: gpio
    pin: GPIO18
    name: "Input T3"
    icon: "mdi:thermostat"
    id: t3
    filters:
      - invert:
      - delayed_off: 500ms
    on_state:
      - script.execute: update_relays


# Define the relay outputs
switch:
  - platform: gpio
    pin: 22
    name: "Relay K1"
    id: k1
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    pin: 17
    name: "Relay K2"
    id: k2
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    pin: 16
    name: "Relay K3"
    id: k3
    restore_mode: RESTORE_DEFAULT_OFF

# Define a restart button
button:
  - platform: restart
    name: "Restart"

# Select component for profile switching
select:
  - platform: template
    name: "Active Profile"
    id: profile_selector
    options:
      - "Profile 0 (Hold/Manual)"
      - "Profile 1 (T1=K1, T2=K2, T3=K3)"
      - "Profile 2 (T1=K1&K2, T1&T3=K3)"
      - "Profile 3 (T1=K1, T2|T3=K2&K3)"
      - "Profile 4 (T1&(T2|T3)=All)"
      - "Profile 5 (T2|T3=K1, T2=K2, T3=K3)"
    initial_option: "Profile 4 (T1&(T2|T3)=All)"  # Default profile changed to Profile 4
    optimistic: true
    restore_value: true
    on_value:
      - script.execute: update_relays
  
  - platform: template
    name: "Relay Delay"
    id: relay_delay
    icon: "mdi:timer-outline"
    options:
      - "0 sec"
      - "5 sec"
      - "10 sec"
      - "15 sec"
      - "30 sec"
      - "45 sec"
      - "60 sec"
      - "120 sec"
      - "180 sec"
      - "300 sec"
    initial_option: "0 sec"
    optimistic: true
    restore_value: true

# Relays follow the active profile. Every input or profile change restarts
# the script, so relays only switch once the inputs have been stable for the
# configured delay.
script:
  - id: update_relays
    mode: restart
    then:
      - delay: !lambda "return atoi(id(relay_delay).current_option().c_str()) * 1000;"
      - lambda: |-
          auto profile = id(profile_selector).active_index();
          // Profile 0 (Hold/Manual): relays are left as they are
          if (!profile.has_value() || *profile == 0) return;

          bool in1 = id(t1).state;
          bool in2 = id(t2).state;
          bool in3 = id(t3).state;
          bool out1, out2, out3;
          switch (*profile) {
            case 1: out1 = in1;         out2 = in2;         out3 = in3;         break;
            case 2: out1 = in1;         out2 = in1;         out3 = in1 && in3;  break;
            case 3: out1 = in1;         out2 = in2 || in3;  out3 = in2 || in3;  break;
            case 4: out1 = out2 = out3 = in1 && (in2 || in3);                   break;
            case 5: out1 = in2 || in3;  out2 = in2;         out3 = in3;         break;
            default: return;
          }

          auto set = [](switch_::Switch *relay, bool on) {
            if (relay->state != on) {
              if (on) relay->turn_on(); else relay->turn_off();
            }
          };
          set(id(k1), out1);
          set(id(k2), out2);
          set(id(k3), out3);
